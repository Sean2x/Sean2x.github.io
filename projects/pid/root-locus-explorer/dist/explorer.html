<body>
  <header class="top">
    <h1>PID Root Locus Explorer</h1>
    <nav class="tools">
      <button id="btn-link" title="Copy a link that contains the current state">Copy link</button>
      <button id="btn-save">Save JSON</button>
      <button id="btn-load">Load JSON</button>
      <button id="btn-matlab">MATLAB code</button>
      <button id="btn-embed" title="Chrome-free view with large fonts for recording">Embed view</button>
      <input id="file" type="file" accept="application/json,.json" hidden />
    </nav>
  </header>
  <main class="layout">
    <aside id="controls"></aside>
    <section class="plots">
      <div class="card plot">
        <canvas id="locus"></canvas>
        <div id="readout" class="readout"></div>
        <div class="legend-row" aria-label="Plot legend">
          <span><b class="sym pole">×</b> open-loop pole</span>
          <span><b class="sym zero">○</b> zero</span>
          <span><b class="sym closed">■</b> closed-loop pole (drag me)</span>
          <span><b class="sym" style="color:var(--blue)">━</b> K &gt; 0</span>
          <span><b class="sym" style="color:var(--amber)">━</b> K &lt; 0</span>
          <span><b class="sym mk">◇</b> breakaway</span>
          <span><b class="sym mk">◯</b> axis crossing</span>
        </div>
      </div>
      <div class="card plot short">
        <div class="tabs">
          <button data-tab="y" class="on">Step response y(t)</button>
          <button data-tab="u">Control effort u(t)</button>
          <span class="spacer"></span>
          <button id="btn-ghost">Freeze ghost</button>
          <button id="btn-clear" hidden>Clear ghost</button>
        </div>
        <canvas id="step"></canvas>
      </div>
    </section>
    <section class="insights">
      <div class="card" id="stats"></div>
      <div class="card" id="charpoly"></div>
      <div class="card" id="sumprod"></div>
      <div class="card" id="routh"></div>
    </section>
    <section class="guide" id="guide" aria-label="How to read the plot"></section>
  </main>
  <dialog id="dlg"><form method="dialog"><h2 id="dlg-title"></h2><textarea id="dlg-text" readonly spellcheck="false"></textarea><div class="dlg-btns"><button id="dlg-copy" type="button">Copy</button><button>Close</button></div></form></dialog>
</body>
</html>
