<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rotations</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1116; color: #d7dee9; font: 15px system-ui, sans-serif; padding: 16px; }
  .page { max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
  .left { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  canvas { width: min(100%, 500px); aspect-ratio: 1; }
  .sliders { width: min(100%, 500px); display: grid; gap: 10px; }
  label { display: grid; grid-template-columns: 96px 1fr 84px 44px; align-items: center; gap: 10px; }
  input[type=number] { width: 100%; padding: 4px 6px; background: #1b2230; color: inherit; border: 1px solid #2c3647; border-radius: 6px; font: inherit; text-align: right; }
  input { width: 100%; }
  button { background: #1b2230; color: inherit; border: 1px solid #2c3647; border-radius: 6px; padding: 4px 0; font: inherit; cursor: pointer; }
  button:hover { border-color: #4aa3ff; }

  /* Typed-out matrices */
  .side { display: grid; gap: 14px; font: 15px/1.2 "Cambria Math", "STIX Two Math", Georgia, serif; }
  .step { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .cap { text-align: center; font-size: 13px; color: #8592a6; margin-top: 2px; font-family: system-ui, sans-serif; }
  .group { padding-bottom: 6px; border-bottom: 1px solid #232b38; }
  .eq-sign { padding: 0 2px; }
  .m { display: inline-grid; gap: 4px 14px; padding: 3px 10px; font-style: italic; text-align: center;
       border-left: 2px solid currentColor; border-right: 2px solid currentColor; border-radius: 8px / 14px; align-items: center; }
  .m.v { grid-template-columns: auto; }
  .m.t { grid-template-columns: repeat(3, auto); }
  .m span { white-space: nowrap; }
  sub { font-size: 0.7em; font-style: normal; }
  .total { padding: 10px; border: 1px solid #4aa3ff; border-radius: 10px; background: rgba(74,163,255,.06); }
  .total .cap { color: #4aa3ff; font-size: 14px; }
  .expanded { padding: 8px 6px; }
  .expanded .line { font-style: italic; font-size: 15px; line-height: 1.7; overflow-x: auto; white-space: nowrap; }
  @media (max-width: 860px) { .page { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="page">
  <div class="left">
    <canvas id="c" width="1040" height="1040"></canvas>
    <div class="sliders">
      <label>Yaw ψ (z) <input id="psi" type="range" min="-360" max="360" step="1" value="0" /><input id="psi-n" type="number" min="-360" max="360" step="any" value="0" aria-label="Yaw ψ degrees" /><button type="button" data-zero="psi" title="Rotate back to 0">0</button></label>
      <label>Pitch θ (y) <input id="lam" type="range" min="-360" max="360" step="1" value="0" /><input id="lam-n" type="number" min="-360" max="360" step="any" value="0" aria-label="Pitch θ degrees" /><button type="button" data-zero="lam" title="Rotate back to 0">0</button></label>
      <label>Roll φ (x) <input id="phi" type="range" min="-360" max="360" step="1" value="0" /><input id="phi-n" type="number" min="-360" max="360" step="any" value="0" aria-label="Roll φ degrees" /><button type="button" data-zero="phi" title="Rotate back to 0">0</button></label>
    </div>
  </div>

  <div class="side" id="side" aria-label="Rotation matrices"></div>
</div>

<script>
// ---- typed-out matrices (column vectors; each rotation is applied to the previous result) ----
const col = (a, b, c) => `<div class="m v"><span>${a}</span><span>${b}</span><span>${c}</span></div>`;
const mat = (rows) => `<div class="m t">${rows.flat().map((e) => `<span>${e}</span>`).join('')}</div>`;
const V = (n) => col(`v<sub>x${n}</sub>`, `v<sub>y${n}</sub>`, `v<sub>z${n}</sub>`);
const step = (to, M, from, label) => `<div class="group"><div class="step">${V(to)}<span class="eq-sign">=</span>${mat(M)}${V(from)}</div><div class="cap">${label}</div></div>`;
const V0 = col('v<sub>x</sub>', 'v<sub>y</sub>', 'v<sub>z</sub>');
document.getElementById('side').innerHTML =
  `<div class="group"><div class="step">${V(1)}<span class="eq-sign">=</span>${mat([['cψ', 'sψ', '0'], ['−sψ', 'cψ', '0'], ['0', '0', '1']])}${V0}</div><div class="cap">L<sub>1</sub>(ψ), yaw about z</div></div>` +
  step(2, [['cθ', '0', '−sθ'], ['0', '1', '0'], ['sθ', '0', 'cθ']], 1, 'L<sub>2</sub>(θ), pitch about y') +
  step(3, [['1', '0', '0'], ['0', 'cφ', 'sφ'], ['0', '−sφ', 'cφ']], 2, 'L<sub>3</sub>(φ), roll about x') +
  `<div class="total"><div class="step">${V(3)}<span class="eq-sign">=</span>${mat([
    ['cθcψ', 'cθsψ', '−sθ'],
    ['sφsθcψ − cφsψ', 'sφsθsψ + cφcψ', 'sφcθ'],
    ['cφsθcψ + sφsψ', 'cφsθsψ − sφcψ', 'cφcθ'],
  ])}${V0}</div><div class="cap">L<sub>3</sub> · L<sub>2</sub> · L<sub>1</sub> = transformation matrix (L<sub>1</sub> is applied first)</div></div>` +
  `<div class="expanded"><div class="cap">Expanded</div>` +
  [
    ['x', 'cθcψ', 'cθsψ', '−sθ'],
    ['y', 'sφsθcψ − cφsψ', 'sφsθsψ + cφcψ', 'sφcθ'],
    ['z', 'cφsθcψ + sφsψ', 'cφsθsψ − sφcψ', 'cφcθ'],
  ].map(([a, c1, c2, c3]) => {
    const t = (c) => (c.includes(' ') ? `(${c})` : c);
    return `<div class="line">v<sub>${a}3</sub> = ${t(c1)}·v<sub>x</sub> + ${t(c2)}·v<sub>y</sub> ${c3.startsWith('−') ? '−' : '+'} ${t(c3.replace('−', ''))}·v<sub>z</sub></div>`;
  }).join('') + `</div>`;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const RAD = Math.PI / 180;

// 3x3 matrices as arrays of rows.
const Rx = (a) => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]];
const Ry = (a) => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]];
const Rz = (a) => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]];
const mul = (A, B) => A.map((r) => [0, 1, 2].map((j) => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
const apply = (M, p) => M.map((r) => r[0] * p[0] + r[1] * p[1] + r[2] * p[2]);

// Straight-on view: screen right = +x, screen up = +z, looking along +y.
// At zero rotation the three circles line up square to the screen (one full circle, one horizontal and one vertical line).
const VIEW = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];

// The 3 great circles that cut the ball into 8 octants (each lies in a coordinate plane).
const N = 180;
const circle = (f) => Array.from({ length: N + 1 }, (_, i) => f((i / N) * 2 * Math.PI));
const CIRCLES = [
  { color: '#4aa3ff', pts: circle((t) => [Math.cos(t), Math.sin(t), 0]) }, // xy plane
  { color: '#5ee6a8', pts: circle((t) => [Math.cos(t), 0, Math.sin(t)]) }, // xz plane
  { color: '#ffb454', pts: circle((t) => [0, Math.cos(t), Math.sin(t)]) }, // yz plane
];

const ids = ['psi', 'lam', 'phi'];
const sliders = ids.map((id) => document.getElementById(id));
const boxes = ids.map((id) => document.getElementById(id + '-n'));
const clamp = (v) => Math.max(-360, Math.min(360, v));
sliders.forEach((s, i) => s.addEventListener('input', () => { boxes[i].value = s.value; draw(); }));
boxes.forEach((b, i) => b.addEventListener('input', () => {
  const v = parseFloat(b.value);
  if (isFinite(v)) { sliders[i].value = clamp(v); draw(); } // typing keeps what you typed until you leave the box
}));
// Zero button: ease the slider back to 0
document.querySelectorAll('[data-zero]').forEach((btn) => btn.addEventListener('click', () => {
  const i = ids.indexOf(btn.dataset.zero);
  const from = parseFloat(sliders[i].value), t0 = performance.now(), T = 450;
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / T), e = 1 - (1 - k) ** 3; // ease-out
    const v = from * (1 - e);
    sliders[i].value = v; boxes[i].value = k < 1 ? Math.round(v * 10) / 10 : 0;
    draw();
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}));
boxes.forEach((b, i) => b.addEventListener('change', () => { // out of range or blank: snap back to the slider
  const v = parseFloat(b.value);
  b.value = isFinite(v) ? clamp(v) : sliders[i].value;
  sliders[i].value = b.value; draw();
}));

function draw() {
  const [psi, lam, phi] = sliders.map((s) => parseFloat(s.value) * RAD);
  // psi about z, lambda about y, phi about x: R = Rz(psi) · Ry(lambda) · Rx(phi)
  const M = mul(VIEW, mul(Rz(psi), mul(Ry(lam), Rx(phi))));

  const W = cv.width, c = W / 2, r = W * 0.4;
  ctx.clearRect(0, 0, W, W);
  const proj = (p) => { const q = apply(M, p); return [c + q[0] * r, c - q[2] * r, q[1]]; }; // depth = y (toward viewer is -y)

  // ball
  ctx.lineWidth = 3; ctx.setLineDash([]);
  ctx.strokeStyle = '#8592a6';
  ctx.fillStyle = 'rgba(133,146,166,0.06)';
  ctx.beginPath(); ctx.arc(c, c, r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();

  // dotted great circles: far half faint, near half bright
  ctx.lineCap = 'round'; ctx.lineWidth = 5;
  for (const { color, pts } of CIRCLES) {
    for (const near of [false, true]) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = near ? 1 : 0.28;
      ctx.setLineDash([1, 14]);
      ctx.beginPath();
      let pen = false;
      for (const p of pts) {
        const [x, y, d] = proj(p);
        const isNear = d < 0;
        if (isNear === near) { pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; } else pen = false;
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1; ctx.setLineDash([]);
}
draw();
</script>
</body>
</html>
