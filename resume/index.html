    <main class="resume-page">
      <div class="page-intro">

        <div class="resume-actions">

            href="../assets/docs/Sean-Lirazan-Resume.pdf"

            target="_blank"

          </a>
        </div>
      </div>

      <!-- Pages are drawn here by PDF.js from assets/docs/Sean-Lirazan-Resume.pdf,
           so replacing that PDF is all it takes to update this page. -->
      <section class="resume-viewer terminal-window" aria-label="Resume preview">
        <div class="resume-pages" id="resumePages">
          <p class="resume-status">Loading resume…</p>
        </div>
      </section>
    </main>

    <script src="../assets/js/matrix.js"></script>
    <script src="../assets/js/site.js"></script>
    <script type="module">
      // Render every page of the PDF to a canvas sized to the viewer
      import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
      pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

      const PDF_URL = "../assets/docs/Sean-Lirazan-Resume.pdf";
      const container = document.getElementById("resumePages");

      async function render() {
        const pdf = await pdfjs.getDocument(PDF_URL).promise;
        const width = container.clientWidth;
        const dpr = window.devicePixelRatio || 1;
        const pages = [];

        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          const base = page.getViewport({ scale: 1 });
          const viewport = page.getViewport({ scale: (width / base.width) * dpr });
          const canvas = document.createElement("canvas");
          canvas.className = "resume-page-canvas";
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.setAttribute("role", "img");
          canvas.setAttribute("aria-label", `Resume page ${n} of ${pdf.numPages}`);
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          pages.push(canvas);
        }
        container.replaceChildren(...pages);
      }

      render().catch(() => {
        container.innerHTML =
          '<p class="resume-status">Couldn\'t display the preview — use the buttons above to open or download the PDF.</p>';
      });

      // Re-render crisply after the viewer width changes (e.g. phone rotation)
      let lastWidth = container.clientWidth;
      let timer;
      window.addEventListener("resize", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          if (Math.abs(container.clientWidth - lastWidth) > 40) {
            lastWidth = container.clientWidth;
            render().catch(() => {});
          }
        }, 250);
      });
    </script>
  </body>
