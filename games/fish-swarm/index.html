<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Fish Simulator — Interactive Fish Swarm | Sean Lirazan</title>
    <meta
      name="description"
      content="Play Fish Simulator, a free browser fish swarm where simple local rules (separation, alignment, cohesion) create a school that reacts to your mouse. Built by Sean Lirazan with JavaScript and Canvas."
    />
    <link rel="canonical" href="https://sean2x.github.io/games/fish-swarm/" />

    <!-- Link previews (LinkedIn, iMessage, Discord, X, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sean Lirazan" />
    <meta property="og:title" content="Fish Simulator — Interactive Fish Swarm | Sean Lirazan" />
    <meta property="og:description" content="Play Fish Simulator, a free browser fish swarm where simple local rules (separation, alignment, cohesion) create a school that reacts to your mouse. Built by Sean Lirazan with JavaScript and Canvas." />
    <meta property="og:url" content="https://sean2x.github.io/games/fish-swarm/" />
    <meta property="og:image" content="https://sean2x.github.io/assets/img/projects/fish-swarm.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="icon" href="../../assets/img/favicon.ico" type="image/x-icon" />

    <style>
      :root {
        --Ocean: #242057;
        --Fish: #ff6347;
        --Shark: #3b3a47;
      }
      body {
        margin: 0;
        overflow: hidden;
      }

      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        z-index: -1; /* sits behind everything */
      }
      canvas {
        position: relative; /* THIS is what you meant */
        z-index: 1;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #version {
        position: fixed;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        font-size: 20px;
        opacity: 0.7;
        z-index: 9999;
      }
    </style>
  </head>

  <body>
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Fish Simulator: an interactive fish swarm by Sean Lirazan</h1>
    <div id="version">v2.0.1</div>

    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="ocean.mp4" type="video/mp4" />
    </video>
    <canvas id="canvas"></canvas>

    <script src="fish-swarm.js"></script>
  </body>
</html>
