# Keeps assets/docs/Sean-Lirazan-Resume.pdf in sync with the resume Google Doc.
#
# Daily (and on demand from the Actions tab) it exports the Doc as a PDF and,
# only if the resume's text actually changed, commits it and redeploys the
# site. The Doc must stay shared as "Anyone with the link can view".
#
# Not synced automatically: the resume page's "Text version" and llms.txt —
# update those by hand when the resume changes.
name: Sync resume from Google Docs

on:
  schedule:
    - cron: "0 13 * * *" # daily, 13:00 UTC (6 AM Pacific)
  workflow_dispatch:

permissions:
  contents: write # commit the updated PDF
  actions: write # start the deploy workflow afterwards

concurrency:
  group: sync-resume
  cancel-in-progress: false

env:
  DOC_ID: 1mmRaOnEcfKLmIIX3SS2SF35LlSvCNDzsfIQIivnNUcc
  PDF_PATH: assets/docs/Sean-Lirazan-Resume.pdf

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the Doc as PDF
        run: |
          curl -sSfL -o /tmp/resume.pdf \
            "https://docs.google.com/document/d/${DOC_ID}/export?format=pdf"
          # If sharing was turned off, Google returns a sign-in page, not a PDF
          if [ "$(head -c 5 /tmp/resume.pdf)" != "%PDF-" ]; then
            echo "::error::Download isn't a PDF. Is the Doc still shared as 'Anyone with the link can view'?"
            exit 1
          fi

      - name: Compare text with the current resume
        id: compare
        run: |
          pip install --quiet pypdf
          python - <<'EOF'
          import os, re
          from pypdf import PdfReader

          def text(path):
              pages = PdfReader(path).pages
              return re.sub(r"\s+", " ", "".join(p.extract_text() for p in pages)).strip()

          # Every export has a new timestamp, so compare words, not bytes
          changed = text("/tmp/resume.pdf") != text(os.environ["PDF_PATH"])
          print("Resume text changed:", changed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
          EOF

      - name: Commit the new PDF
        if: steps.compare.outputs.changed == 'true'
        run: |
          cp /tmp/resume.pdf "$PDF_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PDF_PATH"
          git commit -m "Sync resume from Google Docs"
          git push

      # Pushes made by this workflow don't trigger other workflows on their
      # own, so start the deploy explicitly
      - name: Deploy the site
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static.yml --ref main
